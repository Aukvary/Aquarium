syntax = "proto3";

package aquarium.api;

message HealthRequest {}

message HealthResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }

  ServingStatus status = 1;
  string db_initialized = 2;
  bool utilities_initialized = 3;
}

service UtilsService {
  rpc Health(HealthRequest) returns (HealthResponse);
}
