syntax = "proto3";

package aquarium.api;

import "google/protobuf/timestamp.proto";

enum TaskStatus {
  UNSPECIFIED = 0;
  PLAN = 1;
  ACTIVE = 2;
  COMPLETE = 3;
  ARCHIVE = 4;
  IN_REVIEW = 5;
  VERIFIED = 6;
}

message Task {
  int64 id = 1;
  string title = 2;
  string description = 3;

  int64 authorId = 4;
  repeated int64 workerIds = 5;
  optional int64 checkerId = 6;

  TaskStatus status = 7;

  google.protobuf.Timestamp createdAt = 8;
  google.protobuf.Timestamp updatedAt = 9;
  optional google.protobuf.Timestamp dueDate = 10;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;

  int64 authorId = 3;
  repeated int64 workerIds = 4;
  optional int64 checkerId = 5;

  TaskStatus status = 6;
  optional google.protobuf.Timestamp dueDate = 7;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  int64 id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message GetTasksRequest {
  optional TaskStatus status = 1;
  optional int64 authorId = 2;
  optional int64 workerId = 3;

  int32 limit = 4;
  int32 offset = 5;
}

message GetTasksResponse {
  repeated Task tasks = 1;
  int64 totalCount = 2;
}

message UpdateTaskRequest {
  int64 id = 1;
  optional string title = 2;
  optional string description = 3;
  optional int64 checkerId = 4;
  optional google.protobuf.Timestamp dueDate = 5;
}

message UpdateTaskResponse {
  Task task = 1;
}

message UpdateTaskStatusRequest {
  int64 id = 1;
  TaskStatus status = 2;
}

message UpdateTaskStatusResponse {
  Task task = 1;
}

message AssignWorkerRequest {
  int64 id = 1;
  int64 workerId = 2;
}

message AssignWorkerResponse {
  Task task = 1;
}

message RemoveWorkerRequest {
  int64 id = 1;
  int64 workerId = 2;
}

message RemoveWorkerResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  int64 id = 1;
}

message DeleteTaskResponse {
  bool success = 1;
}

enum CommentType {
  COMMENT_GENERAL = 0;
  COMMENT_REVISION_REASON = 1;
  COMMENT_STATUS_CHANGE = 2;
}

message Comment {
  int64 id = 1;
  int64 taskId = 2;
  int64 authorId = 3;
  string content = 4;
  CommentType type = 5;
  google.protobuf.Timestamp createdAt = 6;
}

message AddCommentRequest {
  int64 taskId = 1;
  string content = 2;
  CommentType type = 3;
  optional int64 authorId = 4;
}

message AddCommentResponse {
  Comment comment = 1;
}

message GetCommentsRequest {
  int64 taskId = 1;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

message RejectTaskRequest {
  int64 taskId = 1;
  string reason = 2;
}

message RejectTaskResponse {
  Task task = 1;
  Comment comment = 2;
}

message TaskEvent {
  enum EventType {
    TASK_CREATED = 0;
    TASK_UPDATED = 1;
    STATUS_CHANGED = 2;
    WORKER_ASSIGNED = 3;
    WORKER_REMOVED = 4;
    COMMENT_ADDED = 5;
    TASK_REJECTED = 6;
    TASK_DELETED = 7;
  }
  EventType type = 1;
  int64 taskId = 2;
  optional Task task = 3;
  optional Comment comment = 4;
  int64 actorUserId = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message SubscribeEventsRequest {}

service TaskStoreService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
  rpc AssignWorker(AssignWorkerRequest) returns (AssignWorkerResponse);
  rpc RemoveWorker(RemoveWorkerRequest) returns (RemoveWorkerResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  rpc RejectTask(RejectTaskRequest) returns (RejectTaskResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream TaskEvent);
}
