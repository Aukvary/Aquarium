components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 1

  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    logging:
      loggers:
        default:
          file_path: "@stderr"
          level: debug
          overflow_behavior: discard

    dynamic-config:
    testsuite-support:

    grpc-server:
      port: 8081

    grpc-client-factory:
    grpc-client-common:
      blocking-task-processor: main-task-processor

    grpc-client-middlewares-pipeline:
      load-enabled: true

    health-service:
      health-prefix: "aquarium"
      internal-key: $internal-key
      middlewares:
        authentication-middleware:
          enabled: false
      task-processor: main-task-processor

    authentication-middleware:
      internal-key: $internal-key
      invite-key: $invite-key

    user-store-client:
      endpoint: $user-store-client-endpoint

    grpc-server-middlewares-pipeline:
      middlewares:
        authentication-middleware:
          enabled: true

    user-store-service:
      task-processor: main-task-processor
      middlewares:
        authentication-middleware:
          enabled: true

    task-store-service:
      task-processor: main-task-processor
      middlewares:
        authentication-middleware:
          enabled: true

    postgres-db:
      dbconnection: $pg_connection
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      sync-start: true

    auth-pg-cache:
      pgcomponent: postgres-db
      update-interval: 10s
      update-correction: 0s
      chunk-size: 0

    dns-client:
      fs-task-processor: fs-task-processor
